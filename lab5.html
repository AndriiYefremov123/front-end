<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Перевірка форми + таблиця подій</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    form {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      max-width: 400px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      margin-bottom: 40px;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .error {
      border-color: red;
      background-color: #ffe5e5;
    }
    button {
      margin-top: 15px;
      padding: 10px;
      width: 100%;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }

    /* стилі таблиці */
    table {
      border-collapse: collapse;
      margin: 20px auto;
    }
    td {
      width: 60px;
      height: 60px;
      text-align: center;
      border: 1px solid #333;
      cursor: pointer;
      font-family: sans-serif;
      font-size: 18px;
    }
    input[type="color"] {
      display: block;
      margin: 10px auto;
    }
    #colorPicker {
        width: 350px;        
        height: 20px;        
        border: none;
        cursor: pointer;
        padding: 0;
        display: block;
        margin: 10px auto;
    }
    
  </style>
</head>
<body>

<h2>Перевірка валідності форми</h2>

<form id="myForm">
  <label>ПІБ:</label>
  <input type="text" id="pib" placeholder="ТТТТТТ Т.Т.">

  <label>Група:</label>
  <input type="text" id="group" placeholder="ТТ-ЧЧ">

  <label>Телефон:</label>
  <input type="text" id="phone" placeholder="(123)-456-78-90">

  <label>ID-card:</label>
  <input type="text" id="idcard" placeholder="ТТ №123456">

  <label>Факультет:</label>
  <input type="text" id="faculty" placeholder="ТТТТ">

  <button type="button" id="submitBtn">Перевірити</button>
</form>

<hr>

<h2 style="text-align:center">Завдання 2: Робота з подіями таблиці</h2>
<input type="color" id="colorPicker" value="#00ff00">
<table id="tbl"></table>

<!-- Підключаємо скрипти -->
<script src="js/validate.js"></script>
<script src="js/data.js"></script>
</body>
</html>
